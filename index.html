<div id="world" aria-label="Mosslight Mail fantasy world map">

    <button class="hotspot locked" data-place="falls" aria-label="Visit Crystal Falls" style="left:89%;top:39%"><span class="dot">💎</span><span class="tooltip">Crystal Falls</span></button>
    <button class="hotspot locked" data-place="harbor" aria-label="Visit the Harbor" style="left:91%;top:68%"><span class="dot">⛵</span><span class="tooltip">Harbor</span></button>
    <button class="hotspot" data-place="port" aria-label="Visit the Lakeside Port" style="left:27%;top:73%"><span class="dot">🛶</span><span class="tooltip">Lakeside Port</span></button>
    <button class="hotspot" data-place="farm" aria-label="Visit Meadow Farm" style="left:61%;top:75%"><span class="dot">🌾</span><span class="tooltip">Meadow Farm</span></button>

</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modalShade hidden" id="modal"><section class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle"><header class="panelhead"><div class="paneltitle"><span class="panelicon" id="panelIcon">✉️</span><div><h2 id="panelTitle">Post Office</h2><div class="panelsub" id="panelSub">The mail never sleeps</div></div></div><button class="close" id="closePanel" aria-label="Close">✕</button></header><div class="panelbody" id="panelBody"></div></section></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),SAVE='mosslight-world-v2',OLD='mosslight-mail-v1';
const TYPES={mushroom:{icon:'🍄',name:'Mushroom',desc:'A letter for the cottage lanes.'},acorn:{icon:'🌰',name:'Acorn',desc:'A note for the old oak families.'},leaf:{icon:'🍃',name:'Leaf',desc:'A message for the river and woods.'},moon:{icon:'🌙',name:'Starlight',desc:'A rare letter from the places dreams go.'}};
const PLACES=[
{id:'office',name:'Mosslight Post Office',icon:'✉️',desc:'The heart of the postal network. Every adventure begins with a letter.',req:0,action:'mail'},
{id:'market',name:'Acorn Market',icon:'🛍️',desc:'A bustling row of tiny shops. Trade acorns for lasting upgrades.',req:0,action:'upgrades'},
{id:'forest',name:'Whispering Forest Trail',icon:'🌲',desc:'Old trees keep secrets in their hollow trunks. Find woodland stamp designs.',req:5,action:'stamps'},
{id:'elder',name:'The Elder Tree',icon:'🌳',desc:'The oldest resident of Bramblewick remembers every letter ever sent.',req:3,action:'residents'},
{id:'peak',name:'Starfall Peak',icon:'🏔️',desc:'A winding mountain route where the moonmail collects its silver glow.',req:15,action:'stamps'},
{id:'falls',name:'Crystal Falls',icon:'💎',desc:'Water spills over enchanted stones. Rare stamps sometimes glimmer here.',req:12,action:'stamps'},
{id:'harbor',name:'Lakeside Harbor',icon:'⛵',desc:'The boats carry parcels beyond the valley to places not yet on your map.',req:20,action:'quests'},
{id:'port',name:'Lakeside Port',icon:'🛶',desc:'A quiet jetty, home to ferrymice and the river post route.',req:8,action:'residents'},
{id:'farm',name:'Meadow Farm',icon:'🌾',desc:'A busy patchwork of gardens that sends fresh postcards every morning.',req:6,action:'village'}
];
const BUILDINGS=[
{id:'notice',name:'Village Noticeboard',icon:'📋',desc:'A gathering place for messages and tiny requests.',cost:30,need:3},
{id:'cottage',name:'Pip’s Cottage',icon:'🏡',desc:'A warm little home for your first postkeeper friend.',cost:65,need:7},
{id:'lantern',name:'Mosslight Lantern',icon:'🏮',desc:'Lights the pathway for late-night deliveries.',cost:110,need:12},
{id:'tower',name:'Clock Tower',icon:'🕰️',desc:'Restores the village bell and opens the Moonlight Express.',cost:180,need:20}
];
const UPGRADE_DATA=[
{id:'swift',name:'Swift Satchel',icon:'🎒',desc:'A lighter bag helps the courier earn more with each delivery.',base:40,max:5,effect:'+2 acorns per letter'},
{id:'sort',name:'Enchanted Sorting Tray',icon:'🪄',desc:'The right letter appears more clearly, and streaks pay better.',base:55,max:5,effect:'+1 streak bonus'},
{id:'lantern',name:'Firefly Lantern',icon:'✨',desc:'Draws rare mail into your sorting desk more often.',base:75,max:4,effect:'More starlight letters'}
];
const blank=()=>({acorns:85,delivered:0,streak:0,bestStreak:0,upgrades:{swift:0,sort:0,lantern:0},buildings:{notice:false,cottage:false,lantern:false,tower:false},found:{mushroom:false,acorn:false,leaf:false,moon:false},residents:{pip:false,moss:false,fern:false},questClaimed:false,sound:true});
let s=blank(),current=null,serial=1,audio=null,panelMode='',isSound=true,panX=0,panY=0,mapW=0,mapH=0,drag=null,dragMoved=false,suppressClick=false,saveTimer=null,firstRun=true;
function migrateAndLoad(){try{let v=JSON.parse(localStorage.getItem(SAVE)||'null');if(v){s={...blank(),...v,upgrades:{...blank().upgrades,...v.upgrades},buildings:{...blank().buildings,...v.buildings},found:{...blank().found,...v.found},residents:{...blank().residents,...v.residents}};return}let old=JSON.parse(localStorage.getItem(OLD)||'null');if(old){s.acorns=Math.max(45,+old.acorns||0);s.delivered=Math.max(0,+old.delivered||0);s.streak=Math.max(0,+old.streak||0);s.upgrades={...s.upgrades,...old.upgrades};s.buildings={...s.buildings,...old.buildings};s.found={...s.found,...old.found};}}catch(e){console.info('Starting a new woodland save.')} }
function save(){try{localStorage.setItem(SAVE,JSON.stringify(s))}catch(e){toast('This browser could not save progress.')} }
function laterSave(){clearTimeout(saveTimer);saveTimer=setTimeout(save,80)}
function tone(freq=650,dur=.11,type='sine'){if(!isSound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
function toast(message){const el=$('toast');el.textContent=message;el.classList.remove('show');void el.offsetWidth;el.classList.add('show')}
function sparkles(originX=innerWidth/2,originY=innerHeight/2,icon='✨'){for(let i=0;i<9;i++){let e=document.createElement('span');e.className='confetti';e.textContent=icon;e.style.left=originX+'px';e.style.top=originY+'px';e.style.setProperty('--dx',(Math.random()*180-90)+'px');e.style.setProperty('--dy',(Math.random()*180-100)+'px');document.body.append(e);setTimeout(()=>e.remove(),850)}}
function level(){return 1+Math.floor(s.delivered/5)}
function xp(){return s.delivered%5*20}
function stampCount(){return Object.values(s.found).filter(Boolean).length}
function upgradeCost(u){return Math.floor(u.base*Math.pow(1.65,s.upgrades[u.id]))}
function restoreCount(){return Object.values(s.buildings).filter(Boolean).length}
function getMultiplier(){return 1+Math.min(5,Math.floor(s.streak/3))+s.upgrades.sort}
function renderHud(){ $('acorns').textContent=s.acorns.toLocaleString();$('delivered').textContent=s.delivered.toLocaleString();$('stamps').textContent=stampCount()+'/4';$('mailCount').textContent=Math.max(1,Math.min(9,1+(s.delivered%5)));$('questCount').textContent=(s.delivered<10?2:s.delivered<20?1:0)||'✓';$('soundBtn').textContent=isSound?'🔔':'🔕';
let n=Math.min(5,s.delivered),goal=s.buildings.tower?'The Moonlight Express is open!':s.buildings.cottage?'Help light the Mosslight lantern.':'Restore Pip’s cottage and bring a new friend home.';$('goalText').textContent=goal;$('goalProgressText').textContent=s.buildings.tower?'Village restored':s.delivered<5?'Letters delivered':'Cottage restoration';$('goalProgress').textContent=s.buildings.tower?'4/4':s.delivered<5?n+'/5':Math.min(s.delivered,20)+'/20';$('goalBar').style.width=(s.buildings.tower?100:s.delivered<5?n/5*100:Math.min(100,s.delivered/20*100))+'%';
document.querySelectorAll('[data-place]').forEach(b=>{let p=PLACES.find(x=>x.id===b.dataset.place),locked=s.delivered<p.req;b.classList.toggle('locked',locked);let dot=b.querySelector('.dot');if(dot)dot.textContent=locked?'🔒':p.id==='office'?'✉':p.icon;let tip=b.querySelector('.tooltip');if(tip)tip.textContent=p.name+(locked?' · '+p.req+' letters':'')});
if(s.delivered===0)$('hintbanner').textContent='✦ Your next adventure starts at the glowing Post Office';else if(!s.buildings.cottage)$('hintbanner').textContent='✦ Keep delivering to welcome Pip home';else if(!s.buildings.tower)$('hintbanner').textContent='✦ The clock tower awaits '+Math.max(0,20-s.delivered)+' more deliveries';else $('hintbanner').textContent='✦ The Moonlight Express is ready to explore new routes';}
function setMapSize(){const vw=innerWidth,vh=innerHeight;mapW=Math.max(vw,vh*16/9);mapH=mapW*9/16;$('worldArt').style.width=mapW+'px';$('worldArt').style.height=mapH+'px';panX=Math.min(0,Math.max(vw-mapW,panX));panY=Math.min(0,Math.max(vh-mapH,panY));if(vw<mapW&&panX===0)panX=vw/2-mapW*.5;if(vh<mapH&&panY===0)panY=vh/2-mapH*.5;applyPan()}
function applyPan(){$('worldArt').style.transform='translate('+panX+'px,'+panY+'px)';$('hotspots').style.transform='translate('+panX+'px,'+panY+'px)';$('hotspots').style.width=mapW+'px';$('hotspots').style.height=mapH+'px';document.querySelectorAll('.art-label').forEach(el=>{el.style.transform='translate('+panX+'px,'+panY+'px)'})}
function openPanel(mode){panelMode=mode;const modal=$('modal');modal.classList.remove('hidden');renderPanel(mode);$('closePanel').focus({preventScroll:true})}
function closePanel(){ $('modal').classList.add('hidden');panelMode=''; }
function renderPanel(mode){const icon={mail:'✉️',upgrades:'⚒️',village:'🏡',stamps:'📖',residents:'🦔',quests:'📜',settings:'⚙️',help:'❔',office:'✉️',market:'🛍️',forest:'🌲',elder:'🌳',peak:'🏔️',falls:'💎',harbor:'⛵',port:'🛶',farm:'🌾'}[mode]||'✉️';const titles={mail:'Mosslight Sorting Room',upgrades:'The Acorn Market',village:'Restore Bramblewick',stamps:'The Postkeeper’s Album',residents:'Friends of the Woodland',quests:'Letters & Little Quests',settings:'Post Office Settings',help:'A Note for New Couriers',office:'Mosslight Post Office',market:'Acorn Market',forest:'Whispering Forest Trail',elder:'The Elder Tree',peak:'Starfall Peak',falls:'Crystal Falls',harbor:'Lakeside Harbor',port:'Lakeside Port',farm:'Meadow Farm'};$('panelIcon').textContent=icon;$('panelTitle').textContent=titles[mode]||'A Woodland Discovery';$('panelSub').textContent=mode==='mail'?'Sort • earn acorns • grow your streak':mode==='quests'?'Every letter brings the village closer to life':'The map is yours to explore';$('panel').classList.toggle('wide',['mail','village','quests'].includes(mode));const body=$('panelBody');body.replaceChildren();
if(mode==='mail'){renderMail(body);return}
if(mode==='upgrades'||mode==='market'){renderUpgrades(body);return}
if(mode==='village'){renderBuildings(body);return}
if(mode==='stamps'){renderStamps(body);return}
if(mode==='residents'||mode==='elder'||mode==='port'){renderResidents(body,mode);return}
if(mode==='quests'){renderQuests(body);return}
if(mode==='settings'){renderSettings(body);return}
if(mode==='help'){renderHelp(body);return}
if(PLACES.some(p=>p.id===mode)){renderLocation(body,mode);return}
renderLocation(body,'office')}
function make(tag,cls,text){let e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function makeButton(text,cls,fn){let b=make('button',cls,text);b.addEventListener('click',fn);return b}
function section(body,title,detail){let row=make('div','sectionlabel');row.append(make('span','',title),make('span','',detail||''));body.append(row)}
function renderMail(body){if(!current)spawnLetter();let lead=make('p','lead','Read the stamp on the envelope, then choose its matching delivery chute. Build a streak to earn bonus acorns. Wrong turns only break the streak — your progress is safe.');body.append(lead);
let game=make('div','lettergame');let letter=make('div','lettercard');letter.innerHTML='<span class="letterstamp" id="letterStamp">'+TYPES[current.kind].icon+'</span><small>MOONPOST • BRAMBLEWICK</small><b id="letterType">'+TYPES[current.kind].name+' Letter</b><small>NO. '+current.code+'</small>';
let area=make('div','sortarea');area.append(make('h3','',current.special?'A rare starlight letter!':'New mail has arrived!'),make('p','',current.special?'A little magic glimmers in this envelope. Deliver it to earn a special reward.':'Deliver the letter to its proper home to earn acorns and keep your streak alive.'));
let chutes=make('div','chutes');['mushroom','acorn','leaf'].forEach(k=>{let btn=makeButton('','chute'+(current.kind===k?' target':''),()=>deliver(k));btn.innerHTML='<span class="sym">'+TYPES[k].icon+'</span><b>'+TYPES[k].name+'</b><small>'+(k===current.kind?'MATCHING STAMP':'DELIVERY ROUTE')+'</small>';btn.setAttribute('aria-label','Deliver '+TYPES[k].name+' letter');chutes.append(btn)});
area.append(chutes);game.append(letter,area);body.append(game);
let status=make('div','sortstatus');status.innerHTML='<span>🔥 Streak: <b id="streakValue">'+s.streak+'</b> • Reward multiplier ×'+getMultiplier()+'</span><span>+ acorns for every correct letter</span>';body.append(status);
let tip=make('div','tip');tip.textContent='✦ Little goal: '+Math.max(0,5-s.delivered)+' more deliveries until the first village milestone. Every five letters earns a new postkeeper level.';body.append(tip)}
function spawnLetter(){let special=s.delivered>=8&&Math.random()<Math.min(.28,.07+s.upgrades.lantern*.035);let list=['mushroom','acorn','leaf'];current={kind:list[Math.floor(Math.random()*list.length)],special,code:String(++serial).padStart(3,'0')};}
function deliver(kind){if(!current)return;if(kind!==current.kind){s.streak=0;tone(210,.12,'triangle');toast('Not quite! Match the stamp, little postkeeper.');if(panelMode==='mail')renderPanel('mail');renderHud();laterSave();return}
let old=current,earned=(6+s.upgrades.swift*2)*getMultiplier();if(old.special){earned*=3;s.found.moon=true; s.found[kind]=true}else s.found[kind]=true;
s.acorns+=Math.round(earned);s.delivered++;s.streak++;s.bestStreak=Math.max(s.bestStreak,s.streak);tone(620,.09);setTimeout(()=>tone(old.special?1040:810,.15),65);sparkles(innerWidth*.5,innerHeight*.52,old.special?'🌙':'✨');current=null;
if(s.delivered===3&&!s.buildings.notice)toast('Milestone! The village noticeboard can be restored.');else if(s.delivered===7&&!s.residents.pip&&!s.buildings.cottage)toast('Pip is waiting for a cottage!');else toast((old.special?'Starlight mail! ':'Perfect delivery! ' )+'+'+Math.round(earned)+' acorns');
if(s.streak>0&&s.streak%3===0)setTimeout(()=>toast('✨ '+s.streak+' letter streak! Bonus magic.'),350);
renderHud();laterSave();spawnLetter();if(panelMode==='mail')renderPanel('mail');}
function renderUpgrades(body){body.append(make('p','lead','The market’s craftsmen trade practical improvements for acorns. Every upgrade stays with you, and the village keeps growing around them.'));for(const u of UPGRADE_DATA){let row=make('div','paperrow');row.append(make('div','papericon',u.icon));let copy=make('div','rowcopy');copy.append(make('b','',u.name+' · Lv '+s.upgrades[u.id]+'/'+u.max),make('p','',u.desc),make('span','rowmeta',u.effect));let cost=upgradeCost(u),btn=makeButton(s.upgrades[u.id]>=u.max?'Fully upgraded':'🌰 '+cost,'goldbtn',()=>buyUpgrade(u.id));btn.disabled=s.acorns<cost||s.upgrades[u.id]>=u.max;row.append(copy,btn);body.append(row)}let tip=make('div','tip');tip.textContent='Tip: the Swift Satchel is the cheapest way to boost your acorn income, while the Firefly Lantern helps you find rare starlight mail.';body.append(tip)}
function buyUpgrade(id){const u=UPGRADE_DATA.find(x=>x.id===id);if(!u||s.upgrades[id]>=u.max)return;let cost=upgradeCost(u);if(s.acorns<cost){toast('A few more acorns are needed.');return}s.acorns-=cost;s.upgrades[id]++;tone(510,.1);setTimeout(()=>tone(760,.15),65);toast(u.name+' upgraded!');renderHud();laterSave();if(panelMode)renderPanel(panelMode)}
function renderBuildings(body){const restored=restoreCount();body.append(make('p','lead','Bring Bramblewick back one place at a time. Restorations change your map, invite new residents and open new postal routes.'));let pct=make('div','levelrow');pct.innerHTML='<span>Village restoration</span><b>'+restored+'/4 landmarks restored</b>';body.append(pct);let bar=make('div','bar');bar.innerHTML='<i style="width:'+(restored*25)+'%"></i>';body.append(bar);section(body,'Landmarks to restore','ACORNS');for(const b of BUILDINGS){let done=s.buildings[b.id],unlocked=s.delivered>=b.need,row=make('div','paperrow');row.classList.toggle('done',done);row.append(make('div','papericon',done?'✨':b.icon));let c=make('div','rowcopy');c.append(make('b','',b.name),make('p','',done?'Restored and full of life.':unlocked?b.desc:'Unlock after '+b.need+' letters.'),make('span','rowmeta',done?'RESTORED':unlocked?'Cost: '+b.cost+' acorns':'DELIVERIES '+Math.min(s.delivered,b.need)+'/'+b.need));let btn=makeButton(done?'Restored':unlocked?'Restore · 🌰 '+b.cost:'Locked','goldbtn',()=>restoreBuilding(b.id));btn.disabled=done||!unlocked||s.acorns<b.cost;row.append(c,btn);body.append(row)}}
function restoreBuilding(id){const b=BUILDINGS.find(x=>x.id===id);if(!b||s.buildings[id]||s.delivered<b.need||s.acorns<b.cost){toast('Keep delivering to unlock this restoration.');return}s.acorns-=b.cost;s.buildings[id]=true;if(id==='cottage')s.residents.pip=true;tone(430,.12,'triangle');setTimeout(()=>tone(680,.18),80);sparkles(innerWidth*.55,innerHeight*.5,'🌿');toast(b.name+' restored!');renderHud();laterSave();renderPanel('village')}
function renderStamps(body){body.append(make('p','lead','Every delivery leaves a little memory. Common stamps appear in ordinary letters; starlight stamps only arrive when the forest begins to trust you.'));let grid=make('div','stampgrid');for(const id of ['mushroom','acorn','leaf','moon']){let e=make('div','stamp'+(s.found[id]?' found':''));e.innerHTML='<span>'+TYPES[id].icon+'</span><b>'+TYPES[id].name+'</b><small>'+(s.found[id]?'COLLECTED':'NOT FOUND')+'</small>';grid.append(e)}body.append(grid);section(body,'Album milestones',stampCount()+'/4 found');for(const milestone of [{n:1,t:'First impression',d:'Find any stamp.',r:10},{n:3,t:'A well-travelled postkeeper',d:'Find three stamp types.',r:30},{n:4,t:'Keeper of Mosslight',d:'Complete the album.',r:80}]){let done=stampCount()>=milestone.n,row=make('div','paperrow');row.append(make('div','papericon',done?'🌟':'🔖'));let c=make('div','rowcopy');c.append(make('b','',milestone.t),make('p','',milestone.d),make('span','rowmeta',done?'ACHIEVED':'REWARD · '+milestone.r+' acorns'));row.append(c,make('span','rowmeta',done?'✓':' '+stampCount()+'/'+milestone.n));body.append(row)}}
function renderResidents(body,mode){body.append(make('p','lead','The village is more than cottages and pathways. Each friend has a little story and a reason to send mail.'));const residents=[{id:'pip',name:'Pip the Hedgehog',icon:'🦔',req:7,place:'Pip’s Cottage',desc:'A careful, kind postkeeper who sorts every letter twice.',unlocked:s.residents.pip||s.buildings.cottage},{id:'moss',name:'Moss the Fox',icon:'🦊',req:12,place:'Whispering Forest',desc:'An adventurous explorer who knows every woodland shortcut.',unlocked:s.residents.moss||s.delivered>=12},{id:'fern',name:'Fern the Rabbit',icon:'🐇',req:18,place:'Meadow Farm',desc:'A cheerful gardener who decorates parcels with tiny flower stamps.',unlocked:s.residents.fern||s.delivered>=18}];for(const p of residents){let row=make('div','paperrow');row.append(make('div','papericon',p.unlocked?p.icon:'🔒'));let c=make('div','rowcopy');c.append(make('b','',p.name),make('p','',p.unlocked?p.desc:'Meet after '+p.req+' deliveries at '+p.place+'.'),make('span','rowmeta',p.unlocked?'VILLAGE RESIDENT':'NOT YET MET'));row.append(c);if(!p.unlocked&&s.delivered>=p.req){row.append(makeButton('Meet','goldbtn',()=>{s.residents[p.id]=true;renderHud();laterSave();renderPanel('residents');toast(p.name+' joined the village!')}))}body.append(row)}}
function questData(){return [
{id:'run',icon:'✉️',title:'The First Postal Run',desc:'Deliver five letters safely.',progress:Math.min(s.delivered,5),target:5,reward:25,done:s.delivered>=5},
{id:'home',icon:'🏡',title:'A Home for Pip',desc:'Restore the cottage and welcome Pip.',progress:s.buildings.cottage?1:0,target:1,reward:40,done:s.buildings.cottage},
{id:'stamps',icon:'✨',title:'Little Things to Keep',desc:'Find three different stamp designs.',progress:Math.min(stampCount(),3),target:3,reward:35,done:stampCount()>=3},
{id:'tower',icon:'🕰️',title:'Bring Back the Chimes',desc:'Restore the village clock tower.',progress:s.buildings.tower?1:0,target:1,reward:90,done:s.buildings.tower}
]}
function renderQuests(body){body.append(make('p','lead','A new note arrives whenever something in the valley needs doing. These are gentle goals, not timers — carry on at your own pace.'));for(const q of questData()){let row=make('div','paperrow');row.append(make('div','papericon',q.done?'✅':q.icon));let c=make('div','rowcopy');c.append(make('b','',q.title),make('p','',q.desc),make('span','rowmeta',q.done?'COMPLETE':q.progress+'/'+q.target+' · Reward '+q.reward+' acorns'));let btn=makeButton(q.done?'Completed':q.progress>=q.target?'Claim reward':'Track goal',q.progress>=q.target&&!q.done?'goldbtn':'lightbtn',()=>claimQuest(q.id));btn.disabled=q.done||q.progress<q.target;row.append(c,btn);body.append(row)}}
function claimQuest(id){const q=questData().find(x=>x.id===id);if(!q||!q.done||s.questClaimed&&id==='run')return;if(id==='run'){s.questClaimed=true;}s.acorns+=q.reward;s.found.mushroom=true;toast('Quest complete! +'+q.reward+' acorns');tone(870,.16);renderHud();laterSave();renderPanel('quests')}
function renderLocation(body,id){const p=PLACES.find(x=>x.id===id)||PLACES[0],locked=s.delivered<p.req;let lead=make('p','lead',p.desc);body.append(lead);if(locked){let row=make('div','paperrow');row.append(make('div','papericon','🔒'));let c=make('div','rowcopy');c.append(make('b','','The path is still sleeping'),make('p','',p.req+' successful deliveries are needed before this route opens.'),make('span','rowmeta','PROGRESS '+Math.min(s.delivered,p.req)+' / '+p.req));row.append(c);body.append(row);let go=makeButton('Return to the Post Office','goldbtn',()=>openPanel('mail'));body.append(go);return}
let stats=make('div','grid2');let a=make('div','tile');a.innerHTML='<div class="tilehead"><span>'+p.icon+'</span><b>Explore this landmark</b></div><p>'+p.desc+'</p>';a.append(makeButton('Visit '+p.name,'goldbtn',()=>{tone(500,.08);toast('Welcome to '+p.name+'!');sparkles(innerWidth*.5,innerHeight*.5,p.icon)}));let b=make('div','tile');b.innerHTML='<div class="tilehead"><span>✉️</span><b>Postal activity</b></div><p>Deliver another letter to earn acorns and collect the next stamp.</p>';b.append(makeButton('Sort mail','lightbtn',()=>openPanel('mail')));stats.append(a,b);body.append(stats);if(id==='farm'||id==='port'||id==='elder'||id==='forest'){section(body,'Nearby stories','DISCOVER');let people=makeButton('Meet the woodland residents','lightbtn',()=>openPanel('residents'));body.append(people)}}
function renderSettings(body){body.append(make('p','lead','Make the post office feel right for you.'));let row=make('div','paperrow');row.append(make('div','papericon','🔔'));let c=make('div','rowcopy');c.append(make('b','','Game sound'),make('p','',isSound?'Delivery chimes and little reward notes are on.':'Game audio is muted.'));row.append(c,makeButton(isSound?'Mute sound':'Enable sound','lightbtn',()=>{isSound=!isSound;s.sound=isSound;renderHud();laterSave();renderPanel('settings');tone(640,.08)}));body.append(row);section(body,'Save data','THIS BROWSER');body.append(make('p','lead','Your village saves automatically in this browser. Clearing browser storage will remove local progress.'));body.append(makeButton('Start a fresh village','dangerbtn',()=>{let b=make('div','tip');b.textContent='This clears current local progress. To confirm, press “Clear save” below.';body.append(b);body.append(makeButton('Clear save','dangerbtn',()=>{localStorage.removeItem(SAVE);localStorage.removeItem(OLD);s=blank();current=null;renderHud();spawnLetter();renderPanel('help');toast('A fresh village awaits.')}))}))}
function renderHelp(body){body.append(make('p','lead','Welcome to a woodland postal adventure. This realm is meant to be explored, not rushed.'));const steps=[['1','Explore the painted map','Click a landmark plaque or its glowing marker. Some routes open only after enough deliveries.'],['2','Sort a letter','At the Post Office, match the envelope stamp to the mushroom, acorn or leaf chute.'],['3','Grow the village','Earn acorns, improve your mailroom, restore four landmarks and welcome new animal residents.'],['4','Complete your album','Common stamps appear as you deliver mail. Rare starlight letters begin to appear after eight successful deliveries.'],['5','Keep the magic','Progress is saved automatically in your browser. You can close the menu and continue exploring anytime.']];for(const s1 of steps){let row=make('div','paperrow');row.append(make('div','papericon',s1[0]));let c=make('div','rowcopy');c.append(make('b','',s1[1]),make('p','',s1[2]));row.append(c);body.append(row)}body.append(makeButton('Let’s explore','goldbtn',closePanel))}
function openPlace(id){const p=PLACES.find(x=>x.id===id);if(!p)return;if(s.delivered<p.req){toast('Deliver '+(p.req-s.delivered)+' more letters to unlock this place.');tone(230,.1,'triangle');return}openPanel(id)}
function restoreDynamicPill(){let world=$('world'),pill=$('dynamicResourceMask');if(pill)return;pill=document.createElement('div');pill.id='dynamicResourceMask';pill.style.cssText='position:absolute;left:19.4%;top:1.1%;width:29.7%;height:7.8%;background:linear-gradient(180deg,#2c2921f5,#161e20f4);border:2px solid #92683c;border-radius:13px;box-shadow:0 3px 0 #15191acc;z-index:2;pointer-events:none';world.append(pill)}
function bind(){document.querySelectorAll('[data-place]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();openPlace(b.dataset.place)}));document.querySelectorAll('[data-panel]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();openPanel(b.dataset.panel)}));$('goalOpen').addEventListener('click',()=>openPanel('quests'));$('questTop').addEventListener('click',()=>openPanel('quests'));$('helpBtn').addEventListener('click',()=>openPanel('help'));$('closePanel').addEventListener('click',closePanel);$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closePanel()});$('soundBtn').addEventListener('click',()=>{isSound=!isSound;s.sound=isSound;renderHud();laterSave();tone(700,.08)});addEventListener('keydown',e=>{if(e.key==='Escape')closePanel();if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)&&$('modal').classList.contains('hidden')){let amt=45;if(e.key==='ArrowLeft')panX=Math.min(0,panX+amt);if(e.key==='ArrowRight')panX=Math.max(innerWidth-mapW,panX-amt);if(e.key==='ArrowUp')panY=Math.min(0,panY+amt);if(e.key==='ArrowDown')panY=Math.max(innerHeight-mapH,panY-amt);applyPan()}});const w=$('world');w.addEventListener('pointerdown',e=>{if(e.target.closest('button')||!$('modal').classList.contains('hidden'))return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,px:panX,py:panY};dragMoved=false;w.classList.add('dragging');try{w.setPointerCapture(e.pointerId)}catch(x){}});w.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5)dragMoved=true;if(dragMoved){panX=Math.min(0,Math.max(innerWidth-mapW,drag.px+dx));panY=Math.min(0,Math.max(innerHeight-mapH,drag.py+dy));applyPan()}});const end=e=>{if(!drag)return;if(dragMoved)suppressClick=true;drag=null;w.classList.remove('dragging');};w.addEventListener('pointerup',end);w.addEventListener('pointercancel',end);w.addEventListener('click',e=>{if(suppressClick){e.preventDefault();e.stopPropagation();suppressClick=false}},true);addEventListener('resize',setMapSize)}
migrateAndLoad();isSound=s.sound!==false;setMapSize();restoreDynamicPill();bind();renderHud();spawnLetter();save();if(!s.delivered)setTimeout(()=>toast('Welcome, little postkeeper! The Post Office has mail for you.'),500);
